<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDEREÇO_DO_CSS">
</head>
<body>
    <main>
        <h1>Sorteador</h1>
        <form id="form-sorteio">
            <div class="container">
                <label for="max-number">Número máximo</label>
                <input type="number" id="max-number" required min="2" value="2" step="1">
                <label for="amount-number">Quantidade de números</label>
                <input type="number" id="amount-number" required min="1" value="1" step="1">
            </div>
            <button type="submit">Sortear número</button>
        </form>
        <div class="result">
            <p id="result-title"></p><span id="result-value"></span>
        </div>
    </main>
    <script src="@@ENDEREÇO_DO_JS"></script>
</html>
